<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Book Helper</title>
<style>
  :root { --bg:#0c0f14; --card:#161b24; --txt:#e8ecf2; --dim:#8b94a3; --acc:#4f8cff; --ok:#2ecc71; --bad:#e74c3c; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); border-radius:20px; padding:26px 20px; width:100%; max-width:390px; text-align:center; }
  h1 { font-size:19px; font-weight:600; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  input { width:100%; background:#0e1219; border:1px solid #2a3140; color:var(--txt); border-radius:12px; padding:14px; font-size:18px; text-align:center; letter-spacing:6px; margin-bottom:12px; }
  button { border:0; border-radius:14px; padding:15px; font-size:16px; font-weight:600; cursor:pointer; }
  #startBtn { width:100%; background:var(--acc); color:#fff; }
  #startBtn.live { background:var(--bad); }
  #startBtn:disabled { opacity:.5; }
  #resetBtn { width:100%; margin-top:10px; background:#232a38; color:var(--dim); font-size:13px; padding:10px; }
  .row { display:flex; align-items:center; justify-content:center; gap:8px; margin:16px 0 4px; min-height:22px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  #status { font-size:14px; color:var(--dim); }
  #timer { font-size:13px; color:var(--dim); margin-bottom:8px; }
  #cue { min-height:48px; font-size:16px; font-weight:600; color:var(--acc); padding:12px; background:#0e1219; border-radius:12px; margin-top:10px; word-break:break-word; }
  #cue:empty::before { content:'cues appear here'; color:#3a4254; font-weight:400; }
  #heard { min-height:34px; font-size:12px; color:var(--dim); padding:8px 10px; background:#0e1219; border-radius:10px; margin-top:8px; word-break:break-word; text-align:left; }
  #heard:empty::before { content:'heard speech appears here'; color:#3a4254; }
</style>
</head>
<body>
<div class="card">
  <h1>Book Helper</h1>
  <div class="sub">The Lever of Riches · earphone mode</div>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" maxlength="8" autocomplete="off">
  <button id="startBtn">Start</button>
  <div class="row"><div class="dot" id="dot"></div><span id="status">off</span></div>
  <div id="timer"></div>
  <div id="cue"></div>
  <div id="heard"></div>
  <button id="resetBtn">Reset memory</button>
</div>
<script>
let pc = null, dc = null, micStream = null, live = false, t0 = 0, timerIv = null, wantLive = false;
let retries = 0, wakeLock = null, player = null, reconnectTo = null;
let state = loadState();
let queue = Promise.resolve(); // serialize brain calls so memory stays consistent

const $ = id => document.getElementById(id);
const setStatus = (s, on) => { $('status').textContent = s; $('dot').className = 'dot' + (on ? ' on' : ''); };

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem('bh_state') || 'null');
    if (raw && raw.saved && Date.now() - raw.saved < 2 * 3600 * 1000) return raw.state;
  } catch {}
  return null;
}
function saveState() {
  try { localStorage.setItem('bh_state', JSON.stringify({ saved: Date.now(), state })); } catch {}
}

$('startBtn').onclick = () => { if (live || wantLive) stop(); else start(); };
$('resetBtn').onclick = () => { state = null; saveState(); $('cue').textContent = ''; $('heard').textContent = ''; setStatus(live ? 'listening' : 'memory cleared', live); };

async function start() {
  wantLive = true;
  $('startBtn').disabled = true;
  try {
    // unlock audio output on the user gesture (iOS)
    if (!player) { player = new Audio(); player.playsInline = true; }
    try { player.src = 'data:audio/mp3;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAASW5mbwAAAA8AAAACAAABIADAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4OD/////////////////////////////////AAAAAExhdmM1OC4xMwAAAAAAAAAAAAAAACQCkAAAAAAAAAEgnPQNaQAAAAAAAAAAAAAAAAAAAP/7kMQAA8AAAaQAAAAgAAA0gAAABExBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV'; await player.play().catch(()=>{}); } catch {}

    setStatus('getting session…', false);
    const r = await fetch('/api/session', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: $('pin').value })
    });
    const j = await r.json();
    if (!r.ok) {
      const err = new Error(j.error || 'session failed');
      if (r.status === 401 || r.status === 400) err.fatal = true;
      throw err;
    }

    setStatus('mic…', false);
    if (!micStream) {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    }

    pc = new RTCPeerConnection();
    micStream.getTracks().forEach(tr => pc.addTrack(tr, micStream));
    dc = pc.createDataChannel('oai-events');
    dc.onmessage = onEvent;
    pc.onconnectionstatechange = () => {
      if (['failed','disconnected','closed'].includes(pc.connectionState) && wantLive) {
        reconnect();
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    setStatus('connecting…', false);
    const sdp = await fetch('https://api.openai.com/v1/realtime/calls?model=' + encodeURIComponent(j.model), {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + j.secret, 'Content-Type': 'application/sdp' },
      body: offer.sdp
    });
    if (!sdp.ok) throw new Error('webrtc connect failed (' + sdp.status + ')');
    await pc.setRemoteDescription({ type: 'answer', sdp: await sdp.text() });

    live = true; retries = 0;
    if (!t0) t0 = Date.now();
    if (!timerIv) timerIv = setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $('timer').textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    }, 1000);
    setStatus('listening', true);
    $('startBtn').textContent = 'Stop';
    $('startBtn').classList.add('live');
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  } catch (e) {
    if (e.fatal || e.name === 'NotAllowedError' || e.name === 'NotFoundError') {
      wantLive = false; cleanup(true);
      setStatus(e.name === 'NotAllowedError' ? 'mic permission denied' : e.message, false);
    } else {
      cleanup(false);
      if (wantLive) { reconnect(e.message); } else { setStatus(e.message, false); }
    }
  } finally {
    $('startBtn').disabled = false;
  }
}

function reconnect(msg) {
  cleanup(false);
  retries++;
  if (retries > 30) { wantLive = false; setStatus('gave up: ' + (msg || 'connection lost'), false); return; }
  const delay = Math.min(1000 * Math.pow(1.6, Math.min(retries, 8)), 15000);
  setStatus('reconnecting… (' + retries + ')', false);
  if (reconnectTo) clearTimeout(reconnectTo);
  reconnectTo = setTimeout(() => { reconnectTo = null; if (wantLive) start(); }, delay);
}

function onEvent(ev) {
  let m; try { m = JSON.parse(ev.data); } catch { return; }
  if (m.type === 'conversation.item.input_audio_transcription.completed') {
    const text = (m.transcript || '').trim();
    if (!text) return;
    $('heard').textContent = text;
    askBrain(text);
  }
  if (m.type === 'error' && wantLive) {
    const code = m.error && m.error.code || '';
    if (/session_expired|token/i.test(code)) reconnect('session expired');
  }
}

function askBrain(utterance) {
  queue = queue.then(async () => {
    try {
      const r = await fetch('/api/brain', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: $('pin').value, utterance, state })
      });
      const j = await r.json();
      if (!r.ok) return;
      if (j.state) { state = j.state; saveState(); }
      if (j.speak && j.cue) {
        $('cue').textContent = j.cue + (j.page ? '  · p.' + j.page : '');
        speak(j.cue);
      }
    } catch {}
  });
}

async function speak(text) {
  try {
    const r = await fetch('/api/tts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: $('pin').value, text })
    });
    if (!r.ok) return;
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    if (player) {
      try { player.pause(); } catch {}
      player.src = url;
      player.onended = () => URL.revokeObjectURL(url);
      await player.play().catch(()=>{});
    }
  } catch {}
}

function cleanup(resetUi = true) {
  if (dc) { try { dc.close(); } catch {} dc = null; }
  if (pc) { try { pc.close(); } catch {} pc = null; }
  live = false;
  if (resetUi) {
    if (timerIv) { clearInterval(timerIv); timerIv = null; }
    t0 = 0;
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
    $('startBtn').textContent = 'Start';
    $('startBtn').classList.remove('live');
  }
}

function stop() {
  wantLive = false; retries = 0;
  if (reconnectTo) { clearTimeout(reconnectTo); reconnectTo = null; }
  cleanup(true);
  setStatus('off', false); $('timer').textContent = '';
}

document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wantLive && !wakeLock) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
  }
});
</script>
</body>
</html>
